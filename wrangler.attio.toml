# Dedicated Webflow-to-Attio webhook Worker.
name = "phonic-attio-webhook"
main = "src/attio.js"
compatibility_date = "2026-06-19"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ATTIO_DEFAULT_COUNTRY_CODE = "1"
ATTIO_DEMO_REQUEST_LIST_ID = "33d16209-d8b2-4527-931f-dbc9d681a823"
ATTIO_DEMO_REQUEST_DEFAULT_STATUS = "New"
