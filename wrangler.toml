# Phonic session-token and outbound-call Worker.
name = "phonic-session-token"
main = "src/phonic-api.js"
compatibility_date = "2026-06-19"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://phonic.co,https://www.phonic.co,https://phonic.ai,https://www.phonic.ai,https://phonic-co-staging.webflow.io"
PHONIC_DEFAULT_COUNTRY_CODE = "1"
PHONIC_OUTBOUND_MODE = "managed"
